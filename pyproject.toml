[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroloom"
version = "1.0.0"
description = "A lightweight toolkit for text and file analysis"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zeroloom = "zeroloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
